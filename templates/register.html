<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - College AI Assistant</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary:#4f46e5;
      --primary-dark:#4338ca;
      --bg:#0b1220;
      --panel:#0f172a;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --border:#233047;
      --input:#0b1220;
    }
    body{
      margin:0;
      font-family: Inter, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 20% 10%, rgba(79,70,229,.35), transparent 50%), var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .card{
      width: 100%;
      max-width: 460px;
      background: rgba(15, 23, 42, .82);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
      padding: 26px;
      backdrop-filter: blur(8px);
    }
    .brand{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
    .brand .logo{width:40px;height:40px;border-radius:12px;background:rgba(79,70,229,.2);display:flex;align-items:center;justify-content:center;border:1px solid rgba(79,70,229,.4)}
    h1{font-size:1.25rem; margin:0;}
    p{color:var(--muted); margin:6px 0 18px;}
    label{display:block; font-size:.85rem; color:var(--muted); margin: 12px 0 6px;}
    input{
      width:100%;
      padding: 12px 12px;
      border-radius: 10px;
      border:1px solid var(--border);
      background: var(--input);
      color: var(--text);
      outline:none;
    }
    input:focus{border-color: rgba(79,70,229,.7); box-shadow: 0 0 0 3px rgba(79,70,229,.15)}
    .btn{
      width:100%;
      margin-top: 18px;
      padding: 12px;
      border:none;
      border-radius: 12px;
      background: var(--primary);
      color:white;
      font-weight:700;
      cursor:pointer;
    }
    .btn:hover{background: var(--primary-dark)}
    .row{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}
    .link{color:#a5b4fc; text-decoration:none;}
    .error{margin-top:12px; color:#f87171; font-size:.9rem; display:none;}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo"><i class="fa-solid fa-graduation-cap"></i></div>
      <h1>Create your account</h1>
    </div>
    <p>Start building your study toolkit.</p>

    <form id="registerForm">
      <label>Full Name</label>
      <input type="text" id="name" required placeholder="Your name" autocomplete="name" />

      <label>Email</label>
      <input type="email" id="email" required placeholder="you@example.com" autocomplete="email" />

      <label>Password</label>
      <input type="password" id="password" required placeholder="Create a password" autocomplete="new-password" />

      <label>Confirm Password</label>
      <input type="password" id="confirm_password" required placeholder="Confirm your password" autocomplete="new-password" />

      <button class="btn" type="submit"><i class="fa-solid fa-user-plus" style="margin-right:8px"></i> Register</button>

      <div class="row">
        <span style="color:var(--muted); font-size:.9rem;">Already have an account?</span>
        <a class="link" href="/auth/login">Login</a>
      </div>

      <div class="error" id="errBox"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const errBox = document.getElementById('errBox');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        confirm_password: document.getElementById('confirm_password').value
      };

      const res = await fetch('/auth/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        errBox.textContent = data.error || 'Registration failed.';
        errBox.style.display = 'block';
        return;
      }

      window.location.href = '/dashboard';
    });
  </script>
</body>
</html>
